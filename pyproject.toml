[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vpndetection"
dynamic = ["version"]
description = "Official Python client library for the VPNDetection API. Detect VPNs, proxies, Tor, hosting and CDN IPs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mslm Dev", email = "support@vpndetection.io" }]
keywords = [
    "vpn",
    "vpn-detection",
    "proxy-detection",
    "tor",
    "ip-intelligence",
    "ip-geolocation",
    "fraud-prevention",
    "residential-proxy",
    "mobile-proxy",
    "datacenter-proxy",
    "hosting",
    "cdn",
    "relay",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "attrs>=22.2.0",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "openapi-python-client>=0.29,<0.30",
]

[project.urls]
Homepage = "https://vpndetection.io"
Documentation = "https://docs.vpndetection.io"
Source = "https://github.com/vpndetection-io/sdk-python"
Issues = "https://github.com/vpndetection-io/sdk-python/issues"

[tool.hatch.version]
path = "src/vpndetection/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vpndetection"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "testdata", "spec", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Read by `ruff`, which openapi-python-client runs over its own output, so the generated
# client and the hand-written layer are formatted to the same width.
[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/vpndetection", "tests"]

# Generated from spec/openapi.yaml. It is checked by being regenerated, not by mypy.
[[tool.mypy.overrides]]
module = "vpndetection._generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "cachetools"
ignore_missing_imports = true
