# This directory needs an ini file of its own even though it configures almost nothing.
# Without one, pytest walks UP looking for a rootdir, finds the SDK's pyproject.toml, and
# takes its `testpaths = ["tests"]` with it: the integration run would silently execute
# the unit suite against the working tree instead.
[pytest]
testpaths = .
# The suite talks to a real API, so the useful output is the running commentary each test
# prints about which tier it saw and what it transferred.
addopts = -v -s
